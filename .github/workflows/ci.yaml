name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    # The integration tests in pkg/plugin run against this instance. They are
    # skipped when MONGODB_URI is unset, so `go test ./...` still works locally
    # without any infrastructure.
    services:
      mongodb:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go environment
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Unit and MongoDB integration tests
        env:
          MONGODB_URI: mongodb://root:example@localhost:27017
        run: go test -race -cover ./pkg/...

      - name: Build backend
        uses: magefile/mage-action@v4
        with:
          version: latest
          args: buildAll

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Go environment
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Only the Linux build is needed, the plugin runs inside the Grafana container.
      - name: Build backend
        uses: magefile/mage-action@v4
        with:
          version: latest
          args: build:linux

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Starts Grafana with the plugin mounted, plus a MongoDB seeded from
      # tests/fixtures/mongodb-init.js. `--wait` blocks on both healthchecks.
      - name: Start Grafana and MongoDB
        run: docker compose up -d --wait

      - name: Run end to end tests
        id: e2e
        run: npm run e2e

      - name: Collect Grafana logs
        if: always() && steps.e2e.outcome == 'failure'
        run: docker compose logs --no-color > grafana-logs.txt

      - name: Archive end to end output
        uses: actions/upload-artifact@v7
        if: always() && steps.e2e.outcome == 'failure'
        with:
          name: e2e-report
          path: |
            playwright-report/
            e2e-results/
            grafana-logs.txt
          retention-days: 5

      - name: Stop Grafana and MongoDB
        if: always()
        run: docker compose down -v
