# Documentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: 'github-actions'
    # Workflow files stored in the default location of `.github/workflows`. (You don't need to specify `/.github/workflows` for `directory`. You can use `directory: "/"`.)
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'

  # Maintain dependencies for npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      grafana:
        patterns:
          - '@grafana/*'
      dev-dependencies:
        dependency-type: 'development'
        exclude-patterns:
          - '@grafana/*'
    ignore:
      # These are kept in sync with the scaffolding in .config/, which is
      # generated by `npm run update`. Bumping them on their own breaks the
      # build, see the "Updating the build configuration" section of README.md.
      - dependency-name: '@grafana/eslint-config'
      - dependency-name: '@stylistic/eslint-plugin-ts'

  # Maintain dependencies for the Go backend
  - package-ecosystem: 'gomod'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      gomod:
        patterns:
          - '*'

  # Keep the Grafana and MongoDB images used by the development stack current
  - package-ecosystem: 'docker-compose'
    directory: '/'
    schedule:
      interval: 'weekly'
