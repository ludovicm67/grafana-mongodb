# Documentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: 'github-actions'
    # Workflow files stored in the default location of `.github/workflows`. (You don't need to specify `/.github/workflows` for `directory`. You can use `directory: "/"`.)
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'

  # Maintain dependencies for npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      grafana:
        patterns:
          - '@grafana/*'
      # react-dom pins react to the exact same version, so they must move together.
      # Listed before dev-dependencies so the @types packages land here.
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      dev-dependencies:
        dependency-type: 'development'
        exclude-patterns:
          - '@grafana/*'
    # See the "Dependencies held back" section of README.md for the reasoning
    # behind each entry. Only the blocked major is skipped, minor and patch
    # updates still come through.
    ignore:
      # @typescript-eslint 8 caps TypeScript at <6.1.0.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # Maintain dependencies for the Go backend
  - package-ecosystem: 'gomod'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      gomod:
        patterns:
          - '*'

  # Keep the Grafana and MongoDB images used by the development stack current
  - package-ecosystem: 'docker-compose'
    directory: '/'
    schedule:
      interval: 'weekly'
